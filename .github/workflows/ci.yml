name: Build And Release Pkgs
on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '!.claude/**'
      - '!docs/**'
      - '!.github/**'
      - '!README.md'
      - '.github/workflows/ci.yml'
      - '.github/Gitversion.yml'
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    paths:
      - '**'
      - '!.claude/**'
      - '!docs/**'
      - '!.github/**'
      - '!README.md'
      - '.github/workflows/ci.yml'
      - '.github/Gitversion.yml'
    branches:
      - main

permissions:
  contents: read
jobs:
  # Discover all Go modules dynamically
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - name: Find Go modules
        id: find-modules
        run: |
          # Find all directories containing go.mod, excluding root
          MODULES=$(find . -name "go.mod" -not -path "./go.mod" -exec dirname {} \; | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$MODULES" >> $GITHUB_OUTPUT
          echo "Found modules: $MODULES"

  unit-tests:
    name: unit-test-${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    permissions:
      contents: read
      actions: read
      pull-requests: write # needed for coverage comments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.26
          check-latest: true
      - name: Test ${{ matrix.module }} module
        working-directory: ${{ matrix.module }}
        run: |
          go mod download
          # Fixture packages (loggertest, slippytest, clickhousetest, migratortest) are kept
          # OUT of the coverage profile — they are test doubles, and counting them would let
          # fixture coverage mask production coverage — but their own tests must still RUN.
          # They did not before: one `grep -v test` filter served both purposes, so every
          # test inside a published fixture package was silently skipped. That matters
          # because slippytest is consumer-facing API: a regression dropping the went-live
          # guard or the self-repave rejection from its MockStore.Repave would keep CI green
          # while downstream consumers validated their handling against a double that
          # permits destroying a live slip.
          PKGS=$(go list ./... | grep -v 'test' || echo "./...")
          FIXTURE_PKGS=$(go list ./... | grep 'test' || true)
          go test -cover -coverprofile=../coverage-${{ matrix.module }}.out -covermode=atomic $PKGS
          go tool cover -func=../coverage-${{ matrix.module }}.out
          if [ -n "$FIXTURE_PKGS" ]; then
            echo "Testing fixture packages (excluded from coverage): $FIXTURE_PKGS"
            go test -count=1 $FIXTURE_PKGS
          fi
      - name: check ${{ matrix.module }} test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: ./coverage-${{ matrix.module }}.out
          threshold-total: 75
          source-dir: ./${{ matrix.module }}

  # Merge-gated deterministic integration suite for the Postgres slip store. Only the
  # integration suites the -run filter below names run here (see the notes on the step for why
  # each is included); DEVOPS-343 widened it to name every integration test in the package.
  # The flaky ClickHouse integration tests that once made an unfiltered run a coin flip were
  # deleted with the ClickHouse slip store (DEVOPS-343).
  #
  # Runs directly on the ubuntu-latest VM (NOT inside a `container:` block, unlike some other CI
  # jobs) because testcontainers-go needs direct access to the runner's Docker socket; ubuntu-latest
  # ships Docker out of the box, so no additional setup is required.
  #
  # No `if:` restriction is applied — this job runs on the same push/pull_request trigger
  # conditions (branches/paths) as the rest of the workflow, same as unit-tests, so it is
  # required-by-default for any change that runs the workflow (enforce via branch protection
  # required-status-checks using this job's name).
  integration-test-slippy:
    name: integration-test-slippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.26
          check-latest: true
      # Named rather than run-everything: add deterministic suites here by name as they land.
      # A test this list does not name never runs in CI; DEVOPS-343 found 13 such Postgres
      # integration tests and added them (the last note below).
      #
      # TestPostgresStore_Load* is included because the live-first ordering in LoadByCommit /
      # LoadLiveByCommit decides whether a duplicate-row commit repaves a RUNNING pipeline,
      # and ordering semantics cannot be asserted against pgxmock — only real rows with real
      # timestamps can distinguish "live first" from "most recently updated".
      #
      # TestPostgresStore_Repave is included because it is the only thing that exercises
      # Repave's SQL against a real schema. The pgxmock suite pins statement order and
      # rollback, but only a real Postgres can catch the things that matter most here:
      # that a failed statement actually aborts the transaction, that the SAVEPOINT around
      # the ancestry link really scopes its rollback, and that the enum and column names
      # in the repoint exist.
      #
      # TestUniquenessMigration_V5_Integration is included because it is the only real-schema
      # proof of migration v5's gate (DEVOPS-231 Phase B): that an uncleaned database is
      # refused atomically with the version left at 4, that the post-conditions reject a
      # same-named object of the wrong shape, and that a real 23505 from the unique index
      # maps to ErrDuplicateSlip — the pgxmock suite fabricates that error and cannot prove
      # the real index reports that constraint name. TestPostgresStore_Ancestry is included
      # because v5's fk_ancestry_slip gave InsertAncestryLink a precondition that only a real
      # schema enforces.
      #
      # TestPostgresStore_Claim*, TestPostgresStore_ReleaseClaim,
      # TestPostgresStore_Create_KeepsAnExistingClaim_Integration, the two terminal-write tests
      # (TestPostgresStore_UpdateSlipStatus_TerminalWriteEndsTheClaim_Integration and
      # TestPostgresStore_Update_NeverEndsTheClaim_Integration) and
      # TestClaimedFromMigration_V6* (DEVOPS-367) are included because the claim is a FOR UPDATE
      # transaction whose serialisation, the claimed_from guard on Repave's DELETE, Create's
      # ON CONFLICT arm leaving an existing claim alone, the terminal status write that clears
      # the claim in real SQL (and the full-row Update that does NOT), and v6's down guard are
      # all properties of real Postgres locking and real DDL that pgxmock cannot exercise.
      # TestPostgresStore_ResetSlipInPlace.*_Integration is anchored on the _Integration suffix
      # rather than matched by bare prefix: five further ResetSlipInPlace tests are pgxmock and
      # already run in the unit job. (The bare Load, Repave and TestClaimedFromMigration_V6
      # prefixes do pull 18 unit-job tests in here too, 17 of them pgxmock; they are cheap and
      # harmless.) The four it does select are the only real-Postgres proof that the reset
      # serialises behind a concurrent claim, refuses one taken after the caller's read, carries
      # one that must be carried, and handles the unclaimed and absent rows — the FOR UPDATE race
      # ResetSlipInPlace exists to close, which is exactly what pgxmock cannot exercise.
      # TestPostgresStore_SatisfiesTheClaimContract_Integration runs the SHARED claim contract
      # (slippytest.RunClaimContract) against real Postgres. The same cases run against both
      # test doubles in the unit job, so a divergence between an implementer and the store
      # fails one job or the other — which is the guard three rounds of PR #87 review had to
      # do by hand.
      # TestPostgresStore_ProbeSchema_Integration is included for the same reason: it asserts
      # the probe reports ErrSchemaBehind against a real v5 schema AND that Load there fails
      # with the 42703 the probe exists to pre-empt, which only real DDL produces.
      # The rest are the store's baseline real-schema tests, which matched nothing here until
      # DEVOPS-343 added them by name: TestPostgresStore_CRUD_Integration,
      # TestPostgresStore_CreateUpsert_Integration, TestPostgresStore_FindByCommits_Integration
      # and TestPostgresStore_Ping_Integration (the basic slip reads and writes, and the
      # connection ping); TestPostgresStore_UpdateStep_Pipeline_Integration,
      # TestPostgresStore_History_Integration, TestPostgresStore_UpdateSlipStatus_Integration and
      # TestPostgresStore_SetComponentImageTag_Integration (the step, history, slip-status and
      # image-tag writes); TestPostgresStore_ComponentAggregate_Integration (the aggregate
      # recomputed from component rows); the two TestPostgresStore_TerminalGuard_* tests and
      # TestPostgresStore_PushParsedBypassesGate_Integration (the terminal-freshness guard in the
      # upsert's WHERE clause, its expired window and its push_parsed bypass); and
      # TestRunPostgresMigrations_Integration (the full up migration from an empty database, an
      # idempotent re-run, ValidatePostgresSchema and the slip_status DOMAIN CHECK). Each runs
      # its SQL against a real schema, which pgxmock cannot.
      - name: Run deterministic integration suites (Postgres repave, migrations v5/v6, claims)
        working-directory: slippy
        run: |
          go mod download
          go test -tags integration \
            -run 'TestPostgresStore_Repave|TestPostgresStore_Load|TestUniquenessMigration_V5_Integration|TestPostgresStore_Ancestry|TestPostgresStore_Claim|TestPostgresStore_ReleaseClaim|TestPostgresStore_ResetSlipInPlace.*_Integration|TestPostgresStore_Create_KeepsAnExistingClaim_Integration|TestPostgresStore_UpdateSlipStatus_TerminalWriteEndsTheClaim_Integration|TestPostgresStore_Update_NeverEndsTheClaim_Integration|TestPostgresStore_ProbeSchema_Integration|TestPostgresStore_SatisfiesTheClaimContract_Integration|TestPostgresStore_ComponentlessAggregateWrite|TestClaimedFromMigration_V6|TestPostgresStore_CRUD_Integration|TestPostgresStore_CreateUpsert_Integration|TestPostgresStore_FindByCommits_Integration|TestPostgresStore_Ping_Integration|TestPostgresStore_UpdateStep_Pipeline_Integration|TestPostgresStore_History_Integration|TestPostgresStore_UpdateSlipStatus_Integration|TestPostgresStore_SetComponentImageTag_Integration|TestPostgresStore_ComponentAggregate_Integration|TestPostgresStore_TerminalGuard_Integration|TestPostgresStore_TerminalGuard_ExpiredWindowAllowsRerun_Integration|TestPostgresStore_PushParsedBypassesGate_Integration|TestRunPostgresMigrations_Integration' \
            -count=1 -timeout 10m ./...

  lint:
    name: lint-${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.26
          check-latest: true
      - name: Install tools
        run: make install-tools
      - name: Lint ${{ matrix.module }} module
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          golangci-lint run --config ../.github/.golangci.yml --timeout 5m ./...

  vuln:
    name: check-sec-${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.26
          check-latest: true
      - name: Run vulnerability scan on ${{ matrix.module }} module
        run: make check-sec PKG=${{ matrix.module }}

  # Check that all unit tests passed
  unit-tests-check:
    name: "Unit tests status check"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always()
    steps:
      - name: Check unit test results
        run: |
          echo "Unit tests completed"
          # This job will fail if any of the matrix unit test jobs failed
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Some unit tests failed"
            exit 1
          fi
          echo "All unit tests passed"

  # Check that all lint jobs passed
  lint-check:
    name: "Lint status check"
    runs-on: ubuntu-latest
    needs: lint
    if: always()
    steps:
      - name: Check lint results
        run: |
          echo "Lint jobs completed"
          # This job will fail if any of the matrix lint jobs failed
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Some lint jobs failed"
            exit 1
          fi
          echo "All lint jobs passed"

  # Check that all vuln jobs passed
  vuln-check:
    name: "Vulnerability scan status check"
    runs-on: ubuntu-latest
    needs: vuln
    if: always()
    steps:
      - name: Check vulnerability scan results
        run: |
          echo "Vulnerability scan jobs completed"
          # This job will fail if any of the matrix vuln jobs failed
          if [[ "${{ needs.vuln.result }}" != "success" ]]; then
            echo "Some vulnerability scan jobs failed"
            exit 1
          fi
          echo "All vulnerability scan jobs passed"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push tags and create GitHub releases
    needs:
      - discover
      - unit-tests-check
      - lint-check
      - vuln-check
      # It has no if: or needs:, so every run that can release runs it too.
      - integration-test-slippy
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/fix/') ||
      startsWith(github.ref, 'refs/heads/feat/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.ref }}
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.1.11
      with:
        versionSpec: '6.0.x'
    - name: Calculate Version
      id: calculate_version
      uses: gittools/actions/gitversion/execute@v3.1.11
      with:
        useConfigFile: true
        disableCache: true
        configFilePath: .github/Gitversion.yml
    - name: Compute release version
      id: release_version
      run: |
        BASE="${{ steps.calculate_version.outputs.majorMinorPatch }}"
        if [[ "$GITHUB_REF_NAME" == "main" ]]; then
          echo "version=$BASE" >> $GITHUB_OUTPUT
          echo "prerelease=false" >> $GITHUB_OUTPUT
        else
          LABEL=$(echo "$GITHUB_REF_NAME" | sed 's|/|-|g' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          COUNT=$(git rev-list --count "origin/main..HEAD" 2>/dev/null || echo "1")
          [[ -z "$COUNT" || "$COUNT" == "0" ]] && COUNT=1
          echo "version=${BASE}-${LABEL}.${COUNT}" >> $GITHUB_OUTPUT
          echo "prerelease=true" >> $GITHUB_OUTPUT
        fi
    - name: Create and push tags
      id: create_tags
      env:
        MODULES: ${{ needs.discover.outputs.modules }}
        VERSION: ${{ steps.release_version.outputs.version }}
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

        # Fetch all remote tags so local rev-parse checks are accurate
        git fetch --tags --quiet

        # Create and push main library tag (idempotent: skip if already exists)
        if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null 2>&1; then
          echo "Tag v$VERSION already exists, skipping"
        else
          echo "Creating main library tag v$VERSION"
          git tag -a "v$VERSION" -m "Release goLibMyCarrier v$VERSION"
          git push origin "v$VERSION"
        fi

        # Create and push tags for each module dynamically (idempotent)
        MODULE_LIST=""
        for module in $(echo "$MODULES" | jq -r '.[]'); do
          if git rev-parse -q --verify "refs/tags/$module/v$VERSION" > /dev/null 2>&1; then
            echo "Tag $module/v$VERSION already exists, skipping"
          else
            echo "Creating tag for $module/v$VERSION"
            git tag -a "$module/v$VERSION" -m "Release $module/v$VERSION"
            git push origin "$module/v$VERSION"
          fi
          MODULE_LIST="$MODULE_LIST- **$module** - $(head -1 $module/README.md 2>/dev/null | sed 's/^# //' || echo "$module package")\n"
        done

        # Store module list for release notes
        echo "module_list<<EOF" >> $GITHUB_OUTPUT
        echo -e "$MODULE_LIST" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Generate release body
      id: release_body
      env:
        MODULES: ${{ needs.discover.outputs.modules }}
        VERSION: ${{ steps.release_version.outputs.version }}
      run: |
        # Generate package list for release notes
        PACKAGE_LIST=""
        DOC_LIST=""
        for module in $(echo "$MODULES" | jq -r '.[]'); do
          DESC=$(head -1 "$module/README.md" 2>/dev/null | sed 's/^# //' || echo "$module package")
          PACKAGE_LIST="$PACKAGE_LIST- **$module** - $DESC\n"
          DOC_LIST="$DOC_LIST- [$module](https://pkg.go.dev/github.com/MyCarrier-DevOps/goLibMyCarrier/$module@v$VERSION)\n"
        done

        cat << EOF > release_body.md
        # goLibMyCarrier v$VERSION

        This release includes updates to all Go packages in the goLibMyCarrier collection.

        ## Packages Released

        All packages have been tagged with version \`v$VERSION\`:

        $(echo -e "$PACKAGE_LIST")

        ## Installation

        Install any package using:
        \`\`\`bash
        go get github.com/MyCarrier-DevOps/goLibMyCarrier/<package>@v$VERSION
        \`\`\`

        ## Documentation

        View package documentation on pkg.go.dev:
        $(echo -e "$DOC_LIST")
        EOF
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.release_version.outputs.version }}
        PRERELEASE: ${{ steps.release_version.outputs.prerelease }}
      run: |
        if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "Release v$VERSION already exists, skipping"
        else
          PRERELEASE_FLAG=""
          [[ "$PRERELEASE" == "true" ]] && PRERELEASE_FLAG="--prerelease"
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes-file release_body.md \
            $PRERELEASE_FLAG
        fi

    - name: Refresh pkg.go.dev cache for main module
      env:
        VERSION: ${{ steps.release_version.outputs.version }}
      run: |
        # Request pkg.go.dev to fetch the new main module version
        echo "Requesting pkg.go.dev refresh for main module v$VERSION"
        curl -s "https://proxy.golang.org/github.com/!my!carrier-!dev!ops/go!lib!my!carrier/@v/v$VERSION.info" || true

        # Give the proxy a moment to process
        sleep 2

        # Trigger documentation generation for main module
        echo "Triggering pkg.go.dev documentation for main module"
        curl -s "https://pkg.go.dev/github.com/MyCarrier-DevOps/goLibMyCarrier@v$VERSION" > /dev/null || true

  # Refresh pkg.go.dev cache for each module in parallel
  refresh-pkg-cache:
    name: refresh-pkg-${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - discover
      - release
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - name: Refresh pkg.go.dev cache for ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Convert module path to Go module proxy format (uppercase letters become !lowercase)
          ENCODED_MODULE=$(echo "$MODULE" | sed 's/\([A-Z]\)/!\L\1/g')

          # Request pkg.go.dev to fetch the submodule version via Go proxy
          echo "Requesting pkg.go.dev refresh for $MODULE/v$VERSION"
          curl -s "https://proxy.golang.org/github.com/!my!carrier-!dev!ops/go!lib!my!carrier/$ENCODED_MODULE/@v/v$VERSION.info" || true

          # Give the proxy a moment to process
          sleep 2

          # Trigger documentation generation for the submodule
          echo "Triggering pkg.go.dev documentation for $MODULE"
          curl -s "https://pkg.go.dev/github.com/MyCarrier-DevOps/goLibMyCarrier/$MODULE@v$VERSION" > /dev/null || true

          echo "pkg.go.dev refresh completed for $MODULE"
